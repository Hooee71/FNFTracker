# Builds the Microsoft Store package (.msix) to upload in Partner Center.
#
#  - On a version tag (same tags as release.yml): builds FNFTracker-<version>.msix.
#  - From the Actions tab ("Run workflow"): builds any version you type in.
#  - On pull requests that touch the packaging: builds a TEST package, just to check it still works.
#
# Download the .msix from the run's "Artifacts" section and upload it in Partner Center.
name: Store package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, like 0.6.0"
        required: true
  pull_request:
    paths:
      - "store/**"
      - ".github/workflows/store.yml"
      - "FnfTracker.App/FnfTracker.App.csproj"

jobs:
  msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build MSIX
        id: build
        shell: pwsh
        run: |
          switch ("${{ github.event_name }}") {
            "push"              { store\build-msix.ps1 -Version ("${{ github.ref_name }}".TrimStart("v")) }
            "workflow_dispatch" { store\build-msix.ps1 -Version "${{ inputs.version }}" }
            default             { store\build-msix.ps1 -Version 0.0.1 -Test }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: store-package
          path: ${{ steps.build.outputs.msix }}
          if-no-files-found: error
